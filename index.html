<!DOCTYPE html>
<html>
<head>
    <title>ABC Hospital</title>
</head>

<body>

    <h1>ABC Hospital Management System</h1>

    <h2>Welcome to ABC Hospital</h2>

    <p>Book your appointment with our doctors.</p>

    <h3>Doctors</h3>

    <ul>
        <li>Dr. Kumar - Cardiologist</li>
        <li>Dr. Priya - General Physician</li>
        <li>Dr. Arun - Orthopedic</li>
    </ul>

    <h3>Appointment</h3>

    <form>
        <label>Patient Name:</label>
        <input type="text">

        <br><br>

        <label>Doctor:</label>
        <select>
            <option>Dr. Kumar</option>
            <option>Dr. Priya</option>
            <option>Dr. Arun</option>
        </select>

        <br><br>

        <label>Appointment Date:</label>
        <input type="date">

        <br><br>

        <button type="submit">Book Appointment</button>
    </form>

</body>
</html>
